# Error text
#
# Every message a customer can see when the BNG service refuses something,
# in one place, so that product, BAs and UCD can review it and propose
# changes here by pull request. The pages' code reads it; it holds no wording
# of its own.
#
# What belongs here: any words shown because something was refused or went
# wrong. Hints and guidance, such as a note about an imported value, are the
# page's own content and stay in its template.
#
# What cannot be here, because the service does not show it:
#   - Defra ID's sign-in pages, the file uploader's own responses, and the
#     platform's pages while the service is down or deploying
#   - the browser's own messages, such as a failed download
#   - the bare error the server sends if its error page itself fails
#
# Sections
#
#   common   words every page shares, such as the error summary's title.
#   upload   the drop-out page (/error-file), shown when an uploaded
#            GeoPackage is refused. Keyed by the backend's error code.
#            A code met only on an edit has no entry here.
#   edit     refusals of a change made to a habitat on screen, after the file
#            was accepted. Keyed by the backend's error code.
#   forms    a form field's own validation, before anything reaches the
#            backend. Keyed by field, then by rule.
#   pages    a whole page shown in place of the one asked for, such as
#            "Page not found". Keyed by page.
#
# Wording rules, which the file's checks (error-text.js) hold it to
#
# - Plain text only in common, forms, edit and pages: no HTML. A page shows
#   the words as typed.
# - {braces} are filled in by the page: a limit from the code, or a value from
#   the customer's file or answer. Only the sentence around a value is
#   wording; the value itself is not.
# - [link text](target) links. A line is split at its link before its
#   {braces} are filled in, so a value cannot make or move a link.
# - Each grammatical form is a rule of its own, as "missingOne" and
#   "missingSeveral" are, rather than words the code adds.
#
# Which section a backend code belongs in is the backend's to say
# (bng-metric-backend, src/validation/geopackage/errors.js,
# ERROR_CODE_SURFACES): an upload code needs an entry under upload.errors, an
# edit code one under edit, and a code that is both, one in each. A nightly
# check in bng-metric-harness (npm run check:dropout-copy) fails on a backend
# code missing from its section, or an entry for a code the backend no longer
# has.
#
# Wording that is not final says so, in any section, with a "wording" field
# on its entry:
#
#   wording: interim   the pages show it, but UCD has not reviewed it
#   wording: none      it has no words of its own yet, so the page shows a
#                      generic message instead. Only where that is so: an
#                      edit or forms rule, which then has no words, or an
#                      upload error whose singleProblemPage names a shared
#                      page. On an upload error it means its single-problem
#                      page: its problemsList heading is still shown when the
#                      page lists it with others. A common text, a page or a
#                      shared page is always shown, so can only be interim
#
# An entry with no "wording" field is final. Search for "wording:" to find
# everything UCD still has to word. A "none" where the page would show words
# fails the file's check. Any other value is logged as a warning when the
# service starts and counts as unfinished wording, but changes nothing the
# page shows: it still shows the entry's words, so the entry must have them.
#
# What each upload rule checks, and which example file shows it:
# https://github.com/DEFRA/bng-metric-harness/blob/main/docs/geopackage-validation-explained.md

# ------------------------------------------------------------------ common

common:
  # The title of every error summary.
  summaryTitle: There is a problem

  # Shown against a field for a check whose code names no forms rule, rather
  # than the validation library's own wording, which names the field's code.
  # The gap is logged for a developer to add a rule. Also shown on purpose for
  # a check only a form posted from elsewhere can fail, such as a radio
  # button's value.
  unworded:
    wording: interim
    text: There is a problem with this answer

# ------------------------------------------------------------------ upload
#
# The drop-out page.
#
# How to read it
#
# - The page has two designs, and each problem is worded for both:
#
#     singleProblemPage   the file has this one problem. The page shows a
#                         title, an optional subheading and a sentence:
#
#                           This parcel P12 contains an error
#                           This parcel is overlapping itself. Draw the
#                           parcel again and upload a new file.
#
#     problemsList        the file has several problems. The page lists them,
#                         each under its heading, with a bullet for each
#                         habitat it names:
#
#                           We couldn't accept your baseline file
#                           Parcels are too small
#                             P3 — 0.2 sq m
#                             P7 — 0.1 sq m
#                           Some habitats have no parent
#                             H14
#
# - A problem with no singleProblemPage is shown in the problems list even
#   when it is the file's only one: its heading says what is wrong, and its
#   bullets name each habitat to put right.
#
# - A singleProblemPage worded for one habitat, as "This parcel {ref}" is,
#   cannot describe a problem that names several. Give it two versions:
#
#     singleProblemPage:
#       one:
#         title: This parcel {ref} contains an error
#         body: ...
#       several:
#         title: '{count} parcels contain an error'
#         body: ...
#
#   one is for a problem naming one habitat, or none, and several for one
#   naming more, where {count} says how many. Without them, a problem naming
#   several is shown in the problems list, which names each.
#
# - {braces} are filled in from the uploaded file: a Habitat Ref, a count, a
#   length. Everything else is shown word for word.
#
# - Where a line gives a list of options, the first whose {values} are all
#   known is used. So "This parcel {ref} contains an error" is shown when the
#   service knows the parcel's ref, and the next option when it does not.
#
# - A problem's bullets are one of two kinds:
#     item     one bullet for each habitat the problem lists, filled in from
#              that habitat
#     detail   the one bullet of a problem that lists no habitats, filled in
#              from the values the service sends with it
#
# - A bullet given as a list of parts shows each part only when all of that
#   part's {values} are known, so a habitat with no habitat type is shown
#   without the " — {habitatType}" part.
#
# - [link text](upload) is the link back to the upload page. When the page has
#   nowhere to link to, the sentence ends at the word before " and", with a
#   full stop. [link text](metric-tool) links to the statutory metric tool.
#
# - singleProblemPage can instead name a shared page, worded for a problem
#   naming any number of habitats:
#     catch-all        the problem has no copy of its own and is in the
#                      file's layers or columns, so the page shows "catchAll"
#                      below, which says to rename them
#     file-problem     the problem has no copy of its own and is elsewhere in
#                      the file, so the page shows "fileProblem" below, which
#                      says only that the file has an error. A code with no
#                      entry here is shown this way too
#     service-problem  the service failed, not the file, so the page shows
#                      "serviceProblem" below
#
# - A heading here is shown word for word, with any {braces} filled in, and
#   a detail the same way. The {braces} of a heading and a detail are values
#   the service sends with the problem (bng-metric-backend,
#   src/validation/geopackage/errors.js, ERROR_CODE_DETAILS); a heading whose
#   values the service did not send shows the catch-all title instead.
#
# - "variants" words a problem the service words more than one way. The
#   service names the way it chose, and that variant's heading, item or detail
#   replaces the problem's own. bng-service is the BNG Service template's
#   wording of a check the legacy template shares.
#
# - problemsList: catch-all heads the problem with the catch-all title below.
#   It is for a problem the page never lists: the service refuses it alone,
#   or does not refuse a file with it at all.
#
# - The page never shows the service's own message. It is for its logs.
#
# - Some wording repeats what the backend defines, word for word. Nothing
#   fails when the backend changes it, as the nightly check compares only the
#   codes, so change the wording here in the same change. In
#   bng-metric-backend, src/validation/geopackage/:
#
#     AREA_PARCELS_TOO_SMALL              "1 square metre": MIN_PARCEL_AREA_SQ_M,
#                                         in geometry-constants.js
#     VERTICAL_HABITAT_AREA_NOT_POSITIVE  "Area (ha)": AREA_COLUMN, in
#                                         vertical-area-check.js
#     TREE_COUNT_NOT_WHOLE                "Count" and "(1 or more)": COUNT_COLUMN
#                                         and MIN_TREE_COUNT, in
#                                         tree-count-check.js
#     STAGED_* (the lineage errors)       each heading: the backend's message,
#                                         in service-template/lineage/
#                                         lineage-rules.js and parent-links.js
#
#   A {value} the backend sends, such as TEXT_TOO_LONG's {limit}, cannot fall
#   out of step, and needs no entry here.

upload:
  page:
    title: There is a problem with your file
    summaryTitle: There is a problem with your file
    listHeading: We couldn't accept your {fileLabel} file
    listIntro: >-
      Your file is a valid GeoPackage, but we found problems with its contents.
      Fix the issues listed below and upload it again.
    more: … and {count} more
    uploadButton: Upload a different file
    backToProject: Back to project
    backToStart: Back to start
    opensInNewTab: (opens in a new tab)
    # Shown when the page is opened with no problems to show, such as after a
    # refresh.
    noErrorsHeading: There is a problem with your file
    noErrorsBody: We couldn't accept your file. Please try again.

  links:
    metric-tool: https://www.gov.uk/government/publications/statutory-biodiversity-metric-tools-and-guides

  # The copy for a problem that has none of its own (BMD-339). Every file
  # structure error lands here. The service-template flag decides which.
  catchAll:
    legacyTemplate:
      title: Your Geopackage (.gpkg) file contains an error
      body: >-
        The layer names and column names do not match what is required by
        Natural England. Rename the layers and columns and
        [upload a new file](upload).
    serviceTemplate:
      title: Your Geopackage (.gpkg) file contains an error
      body: >-
        The layer names and column names do not match the BNG Service template.
        Rename the layers and columns and [upload a new file](upload).

  # A problem in the file with no copy of its own, outside its layers and
  # columns: shown for singleProblemPage: file-problem, and for a code with
  # no entry.
  fileProblem:
    wording: interim
    title: Your Geopackage (.gpkg) file contains an error
    body: >-
      Check the habitats in your file and [upload a new file](upload).

  # The service failed to check the file, so there is nothing for the user to
  # change: shown for singleProblemPage: service-problem. GOV.UK's wording for a
  # service problem.
  serviceProblem:
    wording: interim
    title: Sorry, there is a problem with the service
    body: Try again later.

  # How a bullet names a habitat, the first option whose values are known.
  names:
    # Most problems.
    feature:
      - Feature Ref {featureRef}
      - fid {fid}
      - 'feature #{idx}'
      - feature
    # A BNG Service template tree, by the template's Habitat Ref column.
    tree:
      - Habitat Ref {featureRef}
      - fid {fid}
      - 'feature #{idx}'
      - a tree
    # BNG Service template lineage problems.
    habitat:
      - '{ref}'
      - fid {fid}
      - a habitat

  # Shown in place of a value the file does not give.
  unknown:
    location: unknown location
    habitatType: unknown habitat
    distinctiveness: unknown
    area: blank
    # A table's spatial reference system id when the file sets none.
    srsId: unset
    # A name or type the file holds, such as a geometry column's, when it
    # leaves it blank.
    blank: blank

  # Distinctiveness bands as the user reads them.
  distinctiveness:
    V.High: Very high
    High: High
    Medium: Medium
    Low: Low
    V.Low: Very low

  # The layers a problem can name a habitat in, as the page names them: the
  # subheadings UCD gives problems about each layer.
  layers:
    habitats: Habitat parcels
    hedgerows: Hedgerows
    watercourses: Watercourses

  errors:
    # ---------------------------------------------------------------- file name

    INVALID_FILENAME:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          The file name contains characters we cannot accept. Rename the file
          using letters, numbers, spaces, hyphens, underscores or brackets and
          [upload the renamed file](upload).
      problemsList: catch-all

    FILENAME_TOO_LONG:
      singleProblemPage: catch-all
      problemsList: catch-all

    INVALID_FILE_METADATA:
      singleProblemPage: service-problem
      problemsList: catch-all

    # -------------------------------------------------------------- file format

    GPKG_INVALID_FILE:
      singleProblemPage: catch-all
      problemsList:
        heading: 'File is not a valid GeoPackage'

    GPKG_NOT_A_GEOPACKAGE:
      singleProblemPage: catch-all
      problemsList:
        heading: 'File is not a GeoPackage (application_id 0x{applicationId} is not a recognised GeoPackage identifier)'

    GPKG_MISSING_SYSTEM_TABLE:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Missing required GeoPackage system table'
        detail: '{table}'

    GPKG_TOO_MANY_FEATURES:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains too many features
        body:
          - >-
            This file contains {featureCount} features. This service can check up
            to {maxFeatureCount}. Reduce the number of features and
            [upload a new file](upload).
          - >-
            This file contains more features than this service can check. Reduce
            the number of features and [upload a new file](upload).
      problemsList:
        heading: >-
          GeoPackage contains {featureCount} features across its boundary,
          habitat, hedgerow and watercourse layers; the maximum this service can
          validate is {maxFeatureCount}

    # --------------------------------------------------------- layers and columns

    GPKG_MISSING_LAYER:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Missing required feature layer in GeoPackage'
        detail: '{layer}'

    GPKG_UNEXPECTED_FEATURE_LAYER:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Unexpected feature layer "{layer}" — not listed in baseline template schema'
        variants:
          bng-service:
            heading: 'Unexpected feature layer "{layer}" — not a table of the BNG Service template'

    GPKG_BASELINE_CONTENTS_DATA_TYPE:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'expected data_type "{expected}" in gpkg_contents but found "{found}"'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'

    GPKG_BASELINE_SRS_ID:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'expected srs_id {expectedSrsId} but GeoPackage srs_id is {foundSrsId}'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'
          contents:
            detail: 'expected srs_id {expectedSrsId} but gpkg_contents has {contentsSrsId}'
          unreadable:
            detail: 'expected srs_id {expectedSrsId} but could not read a valid integer srs_id from gpkg_contents ({contentsSrsId}) nor gpkg_geometry_columns ({geometryColumnsSrsId})'

    GPKG_BASELINE_GPKG_SRS_INCONSISTENT:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" GeoPackage srs_id inconsistent'
        detail: 'gpkg_contents has {contentsSrsId} but gpkg_geometry_columns has {geometryColumnsSrsId}'

    GPKG_BASELINE_INVALID_GEOMETRY_COLUMN_NAME:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" geometry column "{column}" has an invalid name in gpkg_geometry_columns'
        variants:
          named:
            heading: 'Layer "{layer}" does not match the BNG Service template'
            detail: 'its geometry column is named "{column}" but should be "{expected}"'

    GPKG_BASELINE_MULTIPLE_GEOMETRY_COLUMNS:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'expected exactly one geometry column in the feature table but found {found}'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'
          registered:
            detail: 'expected exactly one geometry column in gpkg_geometry_columns but found {found}'

    GPKG_BASELINE_GEOMETRY_TYPE_NAME:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'expected geometry type "{expected}" in gpkg_geometry_columns but found "{found}"'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'

    GPKG_BASELINE_MISSING_COLUMN:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'missing column "{column}"'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'
          geometry:
            detail: 'missing geometry column "{column}"'

    GPKG_BASELINE_COLUMN_SQLITE_TYPE:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'column "{column}" has {actualType} data type but {expectedType} was expected'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'
          not-scalar:
            detail: 'column "{column}" has {actualType} but {expectedType} was expected'
          undeclared:
            detail: 'column "{column}" has no SQLite column type declared but {expectedType} was expected'

    GPKG_BASELINE_COLUMN_NOT_NULL:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'column "{column}" NOT NULL (required) does not match file'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'
          optional:
            detail: 'column "{column}" NOT NULL (optional) does not match file'

    GPKG_BASELINE_COLUMN_PRIMARY_KEY:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'primary key expectation for "{column}" does not match file'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'

    GPKG_BASELINE_GEOMETRY_REGISTRATION_MISSING:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Layer "{layer}" baseline mismatch'
        detail: 'no geometry column registered in gpkg_geometry_columns'
        variants:
          bng-service:
            heading: 'Layer "{layer}" does not match the BNG Service template'

    # ---------------------------------------------------------- BNG Service template

    LEGACY_TEMPLATE_NOT_ACCEPTED:
      singleProblemPage:
        title: There is a problem with your file
        subheading: Template
        body: >-
          Your file is using the legacy template. The service now uses the BNG
          service template.
      problemsList:
        heading: 'This file is in the legacy Natural England template. The service now takes the BNG Service template'
        detail: 'convert the file with the QGIS plugin, then upload it again.'

    TEMPLATE_VERSION_MISSING:
      wording: interim
      problemsList:
        heading: >-
          The file has no template version record, so it is not a BNG Service
          template file.

    TEMPLATE_VERSION_DUPLICATED:
      wording: interim
      problemsList:
        heading: 'The file has {recordCount} template version records, so its template version is unclear. It should have one.'

    TEMPLATE_VERSION_INVALID:
      wording: interim
      problemsList:
        heading: >-
          The file's template version record cannot be read, so its template
          version is unknown.

    TEMPLATE_VERSION_UNSUPPORTED:
      wording: interim
      problemsList:
        heading: 'The file is in version {version} of the BNG Service template, which the service does not read. It reads version {supportedVersions}.'

    POST_INTERVENTION_TABLES_EMPTY:
      wording: interim
      problemsList:
        heading: >-
          The Post-Intervention tables in this file are all empty, so it has no
          post-intervention habitats to upload. Upload it as a baseline, or add
          the post-intervention habitats and upload it again.

    # ------------------------------------------------------- red line boundary

    NO_REDLINE:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          The redline boundary is missing. Draw the red line boundary and
          [upload a new file](upload).
      problemsList:
        heading: >-
          Baseline file contains no redline boundary polygon

    GPKG_RLB_NO_POLYGON:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          The redline boundary is missing. Draw the red line boundary and
          [upload a new file](upload).
      problemsList:
        heading: >-
          Zero red line boundaries in GeoPackage (expecting one)

    GPKG_RLB_TOO_MANY_POLYGONS:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          This file contains multiple red line boundaries. Draw the red line
          boundary again and [upload a new file](upload).
      problemsList:
        heading: >-
          Too many red line boundaries in GeoPackage (expecting one)

    GPKG_RLB_NO_GEOMETRY_COLUMN:
      singleProblemPage: catch-all
      problemsList:
        heading: 'Red Line Boundary layer has no registered geometry column in gpkg_geometry_columns'
        variants:
          bng-service:
            heading: 'The Red Line Boundary table has no geometry column'

    GPKG_RLB_UNREADABLE_GEOMETRY:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Red Line Boundary contains unreadable geometry

    REDLINE_INVALID_GEOMETRY:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          The redline boundary is overlapping itself. Draw the boundary again and
          [upload a new file](upload).
      problemsList:
        heading: 'Redline boundary geometry is invalid'
        detail:
          - '{reason}'
          - ' at {location}'

    REDLINE_OUTSIDE_ENGLAND:
      wording: interim
      problemsList:
        heading: >-
          Redline boundary is outside England

    REDLINE_AREA_TOO_LARGE:
      wording: interim
      problemsList:
        heading: 'Redline boundary area ({areaSqM} sq m) exceeds the 100 sq km limit'

    # ------------------------------------------------------------ area habitats

    NO_HABITAT_AREAS:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          The file doesn't contain any parcels. Draw parcels within your red line
          boundary and [upload a new file](upload).
      problemsList:
        heading: 'Baseline file contains no area habitat polygons'
        variants:
          structure:
            heading: 'Zero area habitat parcels in GeoPackage (expecting at least one)'

    GPKG_HABITATS_NO_GEOMETRY_COLUMN:
      singleProblemPage: catch-all
      problemsList:
        heading: >-
          Habitats layer has no registered geometry column in
          gpkg_geometry_columns

    GPKG_HABITATS_UNREADABLE_GEOMETRY:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Habitats contains unreadable geometry

    GPKG_HABITATS_WRONG_GEOMETRY_TYPE:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Habitats contains feature(s) with non-polygon geometry

    AREA_PARCELS_INVALID_GEOMETRY:
      singleProblemPage:
        one:
          title:
            - This parcel {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            This parcel is overlapping itself. Draw the parcel again and
            [upload a new file](upload).
      problemsList:
        heading: >-
          One or more area habitat polygons have invalid geometry
        item:
          - '{feature}'
          - ' ({reason})'

    PARCEL_OVERLAPS:
      singleProblemPage:
        one:
          - title: These parcels {refA}, {refB} contain an error
            body: >-
              These parcels are overlapping. Draw the parcels again and
              [upload a new file](upload).
          - title: Your Geopackage (.gpkg) file contains an error
            body: >-
              Some parcels in this file are overlapping. Draw the affected
              parcels again and [upload a new file](upload).
        several:
          title: Your Geopackage (.gpkg) file contains an error
          body: >-
            Some parcels in this file are overlapping. Draw the affected parcels
            again and [upload a new file](upload).
      problemsList:
        heading: >-
          One or more area habitat parcels overlap with other parcels
        item: '{featureA} ↔ {featureB}'

    AREA_PARCELS_TOO_SMALL:
      singleProblemPage:
        one:
          title:
            - This parcel {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            This parcel is smaller than 1 square metre. Draw the parcel again and
            [upload a new file](upload).
      problemsList:
        heading: >-
          One or more area habitat parcels are smaller than 1 square metre
        item:
          - '{feature}'
          - ' — ~{area} sq m'

    SLIVERS_OUTSIDE_REDLINE:
      singleProblemPage:
        one:
          title: Your Geopackage (.gpkg) file contains an error
          body: >-
            This parcel is a sliver (a thin strip of land). Draw the parcel again
            and [upload a new file](upload).
      problemsList:
        heading: >-
          Baseline file contains habitat parcel parts outside the redline
          boundary
        item: '~{area} sq m near {location}'

    AREA_PARCELS_OUTSIDE_REDLINE:
      singleProblemPage:
        one:
          title:
            - This parcel {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            This parcel is outside the red line boundary. Draw the parcel again and
            [upload a new file](upload).
      problemsList:
        heading: >-
          One or more area habitat polygons are not entirely within the redline
          boundary
        item:
          - '{feature}'
          - ' — ~{area} sq m near {location}'

    AREA_SUM_MISMATCH:
      wording: interim
      problemsList:
        heading: 'Sum of area habitat polygons ({habitatsAreaSqM} sq m) does not equal redline boundary area ({redlineAreaSqM} sq m)'

    NO_DERIVED_BASELINE_HABITATS:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          This file has no baseline area habitats. Add baseline habitats and
          [upload a new file](upload).
      problemsList:
        heading: 'This post-intervention file has no baseline area habitats, so it cannot replace the project baseline'
        variants:
          read:
            heading: 'The Area Habitats Baseline table in this file has no habitats, so it cannot replace the project baseline'

    BASELINE_TYPE_MISSING:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          Some retained or enhanced habitats have no baseline habitat type. Add a
          baseline habitat type for each of them and [upload a new file](upload).
      problemsList:
        heading: '{rowCount} retained or enhanced rows have no baseline habitat type, so the baseline cannot be derived from this file'

    BASELINE_HABITATS_INCOMPLETE:
      wording: interim
      singleProblemPage:
        one:
          - title: There is a problem with your file
            subheading: '{onlyLayer}'
            body: >-
              Baseline habitat {onlyRef} cannot be processed by the service due
              to a missing or incompatible value.
          - title: There is a problem with your file
            subheading: '{sharedLayer}'
            body: >-
              Some baseline habitats cannot be processed by the service due to
              a missing or incompatible value.
          - title: There is a problem with your file
            body: >-
              Some baseline habitats cannot be processed by the service due to
              a missing or incompatible value.
        several:
          - title: There is a problem with your file
            subheading: '{sharedLayer}'
            body: >-
              Some baseline habitats cannot be processed by the service due to
              a missing or incompatible value.
          - title: There is a problem with your file
            body: >-
              Some baseline habitats cannot be processed by the service due to
              a missing or incompatible value.
      problemsList:
        heading: >-
          One or more baseline habitats cannot be processed by the service due
          to a missing or incompatible value
        item:
          - '{layer}: '
          - '{feature}'
          - ' — {habitatType}'

    # --------------------------------------------------------------- hedgerows

    GPKG_HEDGEROWS_UNREADABLE_GEOMETRY:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Hedgerows contains unreadable geometry

    GPKG_HEDGEROWS_NO_LINESTRING_GEOMETRY:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Hedgerows has feature(s) but no readable linestring geometry

    GPKG_HEDGEROWS_WRONG_GEOMETRY_TYPE:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Hedgerows contains feature(s) with non-linestring geometry

    HEDGEROWS_OUTSIDE_REDLINE:
      singleProblemPage:
        one:
          title:
            - This hedgerow {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            This hedgerow is outside the red line boundary. Draw the hedgerow again
            and [upload a new file](upload).
      problemsList:
        heading: >-
          One or more hedgerow habitats are not entirely within the redline
          boundary

    # ------------------------------------------------------------ watercourses

    GPKG_RIVERS_UNREADABLE_GEOMETRY:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Rivers contains unreadable geometry

    GPKG_RIVERS_NO_LINESTRING_GEOMETRY:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Rivers has feature(s) but no readable linestring geometry

    GPKG_RIVERS_WRONG_GEOMETRY_TYPE:
      singleProblemPage: file-problem
      problemsList:
        heading: >-
          Rivers contains feature(s) with non-linestring geometry

    WATERCOURSES_OUTSIDE_REDLINE:
      singleProblemPage:
        one:
          title:
            - This watercourse {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            This watercourse is outside the red line boundary. Draw the watercourse
            again and [upload a new file](upload).
      problemsList:
        heading: >-
          One or more watercourse habitats are not entirely within the redline
          boundary

    # -------------------------------------------------- vertical area habitats

    VERTICAL_HABITAT_AREA_NOT_POSITIVE:
      singleProblemPage:
        one:
          title:
            - This vertical area habitat {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            The Area (ha) of a vertical area habitat must be a number above 0.
            Enter the area you estimated on site in hectares and
            [upload a new file](upload).
      problemsList:
        heading: >-
          One or more vertical area habitats have an "Area (ha)" that is not a
          number above 0. Enter the area you estimated on site, in hectares
        item: '{feature} (Area: {area})'

    VERTICAL_HABITATS_OUTSIDE_REDLINE:
      singleProblemPage:
        one:
          title:
            - This vertical area habitat {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            This vertical area habitat is outside the red line boundary. Draw the
            vertical area habitat again and [upload a new file](upload).
      problemsList:
        heading: >-
          One or more vertical area habitats are not entirely within the redline
          boundary

    # ------------------------------------------------------- trees and IGGIs

    TREE_COUNT_NOT_WHOLE:
      singleProblemPage:
        one:
          title:
            - This tree {ref} contains an error
            - Your Geopackage (.gpkg) file contains an error
          body: >-
            The Count for a tree is not a whole number of trees. Leave Count blank
            for one tree, or enter how many trees the point stands for and
            [upload a new file](upload).
      problemsList:
        heading: >-
          One or more trees have a "Count" that is not a whole number of trees
          (1 or more). Enter how many trees each point stands for, or leave it
          blank for one tree

    TREES_OUTSIDE_REDLINE:
      wording: interim
      problemsList:
        heading: >-
          One or more trees are not entirely within the redline boundary

    IRREPLACEABLE_TREE:
      wording: interim
      problemsList:
        heading: >-
          One or more trees are marked as irreplaceable habitat. The service
          does not accept irreplaceable trees, such as ancient and veteran trees
        item:
          - '{table} '
          - '{tree}'

    IGGIS_OUTSIDE_REDLINE:
      wording: interim
      problemsList:
        heading: >-
          One or more IGGIs are not entirely within the redline boundary

    # --------------------------------------------------------------- comments

    COMMENT_INVALID_CHARACTERS:
      singleProblemPage:
        title: Your Geopackage (.gpkg) file contains an error
        body: >-
          The file contains a comment that uses non-UTF8 characters. Remove those
          characters and [upload a new file](upload).
      problemsList:
        heading: >-
          One or more comments contain characters that are not valid UTF-8

    # ------------------------------------------------------------ text values

    TEXT_TOO_LONG:
      wording: interim
      problemsList:
        heading: >-
          One or more values are longer than their column allows. Shorten them
          and upload the file again
        item: >-
          {table}, {feature}: {column} has {length} characters. The maximum is
          {limit}

    VALUE_NOT_ALLOWED:
      wording: interim
      problemsList:
        heading: >-
          One or more values are not in their column's drop-down list. Choose a
          value from the list and upload the file again
        item:
          - '{table}, {feature}: {column}'
          - ' has "{value}"'

    FEATURE_UUID_INVALID:
      wording: interim
      problemsList:
        heading: >-
          One or more habitats have a feature_uuid that is not a valid UUID
        item: '{table}, {feature}'

    PARENT_UUID_INVALID:
      wording: interim
      problemsList:
        heading: >-
          One or more habitats have a parent_uuid that is not a valid UUID
        item: '{table}, {feature}'

    PARENT_GEOM_INVALID:
      wording: interim
      problemsList:
        heading: >-
          One or more habitats have a parent_geom that is not the shape of their
          layer written as WKT
        item: '{table}, {feature} (expected a {shape})'

    # ------------------------------------------------------------ habitat refs

    HABITAT_REF_MISSING:
      singleProblemPage:
        title: There is a problem with your project
        subheading: Habitat parcels
        body: Your file contains a habitat with no habitat reference.
      problemsList:
        heading: Your file contains a habitat with no habitat reference
        listsHabitats: false

    HABITAT_REF_INVALID_CHARACTERS:
      singleProblemPage:
        title: There is a problem with your project
        subheading: Habitat parcels
        body: This habitat reference contains characters that are not allowed.
      problemsList:
        heading: This habitat reference contains characters that are not allowed
        listsHabitats: false

    # --------------------------------------------------- habitat eligibility

    HABITAT_DISTINCTIVENESS_NOT_IN_SCOPE:
      singleProblemPage:
        title: >-
          Very high and high distinctiveness habitats are not yet included in
          this service
        body: >-
          Use the [metric tool (spreadsheet)](metric-tool) to calculate
          biodiversity value.
      problemsList:
        heading: >-
          One or more habitats have a distinctiveness that is out of scope for
          the BNG Beta service
        item: '{feature} — {habitatType} ({distinctiveness})'
        note: 'Allowed distinctiveness: {bands}.'

    BASELINE_NOT_ENHANCEABLE:
      singleProblemPage:
        title: There is a problem with your project
        subheading: Service eligibility
        body: >-
          Your project contains habitats that have been enhanced to a level which
          is not yet included in this service. Use the
          [metric tool (spreadsheet)](metric-tool) to calculate biodiversity
          value.
        opensInNewTab: false
      problemsList:
        heading: >-
          One or more habitats are enhanced, but their baseline habitat cannot
          be enhanced in this service
        item:
          - '{feature} — {habitatType}'
          - ' ({condition})'

    # ----------------------------------- BNG Service template lineage (BMD-1083)

    STAGED_PARENT_LINK_MISSING:
      wording: interim
      problemsList:
        heading: >-
          One or more Retained or Enhanced post-intervention habitats do not name
          the baseline habitat they continue
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'

    STAGED_UNKNOWN_PARENT_REF:
      wording: interim
      problemsList:
        heading: >-
          One or more post-intervention habitats name a baseline habitat that is
          not in the file
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'

    STAGED_AMBIGUOUS_PARENT:
      wording: interim
      problemsList:
        heading: >-
          One or more post-intervention habitats have a parent that matches more
          than one baseline habitat
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', named by {childRefs}'

    STAGED_BASELINE_DRIFTED:
      wording: interim
      problemsList:
        heading: >-
          One or more baseline habitats do not have the shape their
          post-intervention habitats were copied from
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied to {childRefs}'

    STAGED_HEDGEROW_CHILDREN_TOO_LONG:
      wording: interim
      problemsList:
        heading: >-
          One or more baseline hedgerows are shorter than the post-intervention
          hedgerows linked to them together
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied to {childRefs}'
          - ' ({length} m, linked {childLength} m)'

    STAGED_VERTICAL_CHILDREN_TOO_LARGE:
      wording: interim
      problemsList:
        heading: >-
          One or more baseline vertical area habitats have a smaller Area (ha)
          than the post-intervention vertical area habitats linked to them
          together
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied to {childRefs}'
          - '; Area {area}, linked {childArea}'

    STAGED_TREE_CHILDREN_TOO_MANY:
      wording: interim
      problemsList:
        heading: >-
          One or more baseline trees have fewer trees than the Retained and
          Enhanced post-intervention trees linked to them together. A tree that
          is kept cannot be more trees than it was
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied to {childRefs}'
          - '; Count {count}, linked {childCount}'

    STAGED_WATERCOURSE_RETAINED_AND_CREATED:
      wording: interim
      problemsList:
        heading: >-
          One or more baseline watercourses have both a Retained or Enhanced part
          and a Created part, so their length cannot be split between what
          continues and what is lost. Draw each as two baseline watercourses, one
          for each part
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied to {childRefs}'

    STAGED_NATURAL_WATERCOURSE_LOST:
      wording: interim
      problemsList:
        heading: >-
          One or more baseline watercourses have no post-intervention habitat,
          but only a canal or a ditch can be permanently lost. Record each as
          Retained, Enhanced or Created
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied to {childRefs}'

    STAGED_DEGRADE_NOT_WORSE:
      wording: interim
      problemsList:
        heading: >-
          One or more habitats are Created in their baseline habitat type without
          a lower condition. A habitat that is kept should be Retained or
          Enhanced; one lost for a time and put back should give its delay in
          starting habitat creation
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied from {parentRef}'

    STAGED_DEGRADE_ADVANCE_NOT_30_PLUS:
      wording: interim
      problemsList:
        heading: >-
          One or more habitats recorded as lost and created again in a lower
          condition are not created 30+ years in advance, as the Metric guide
          asks
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied from {parentRef}'

    STAGED_WATERCOURSE_NO_INTERVENTION:
      wording: interim
      problemsList:
        heading: >-
          One or more watercourses are Created in their baseline River Type with
          no lower condition, more encroachment or shorter length. A watercourse
          with no intervention should be Retained; one lost for a time and put
          back should give its delay in starting habitat creation
        item:
          - '{table} '
          - '{name}'
          - ' — {habitatType}'
          - ', copied from {parentRef}'

    # ------------------------------------------------------ while uploading

    SIZING_FAILED:
      singleProblemPage: service-problem
      problemsList:
        heading: 'Unable to calculate habitat sizes'

    VALIDATION_FAILED:
      singleProblemPage: service-problem
      problemsList: catch-all

    VALIDATION_BUSY:
      singleProblemPage: service-problem
      problemsList:
        heading: &serviceBusy 'The service is busy checking other files. Please try again in a few moments.'

    VALIDATION_UNAVAILABLE:
      singleProblemPage: service-problem
      problemsList:
        heading: 'The file checking service is currently unavailable. Please try again later.'

# -------------------------------------------------------------------- edit
#
# A refusal of a change made on screen. "summary" is shown in the error
# summary at the top of the page and "inline" by the field; content design
# words them differently on purpose. An edit code the pages do not show yet
# has "wording: none" and no words: the page shows its generic error.
#
# A refusal that no one field on the page can put right has "summaryOnly"
# instead of "summary" and "inline": it is shown in the error summary only,
# linked to no field. {braces} in it are filled in by the page; the error
# message export says what each is filled in with.

edit:
  HABITAT_REF_IN_USE:
    wording: interim
    summary: You have entered a habitat reference that is already in use.
    inline: Enter a habitat reference that is not already in use.

  ENHANCEMENT_NOT_VALID:
    wording: none

  HABITAT_DISTINCTIVENESS_NOT_IN_SCOPE:
    wording: none

  STORED_VALUE_NOT_ALLOWED:
    wording: interim
    summaryOnly: >-
      This habitat holds a value saved before the service checked text
      lengths and lists, in its {fields}. Upload the file again, with the
      value corrected, to update this habitat.

  # An edit the backend cannot carry out on this habitat, as against a value it
  # will not accept: the change would make the habitat something its kind
  # cannot become, such as a tree that is no longer a tree. The dropdowns do
  # not offer such a change, so a page in step with the backend cannot raise
  # it; a stale page or a crafted post can. No field the page can edit is to
  # blame, so this is shown in the error summary only, keeping what was typed,
  # rather than blaming the habitat reference or dropping the user on an error
  # page (BMD-1112).
  FEATURE_NOT_EDITABLE:
    wording: interim
    summaryOnly: >-
      This habitat cannot be changed in that way, so nothing has been saved.
      Check what you have changed, or upload the file again with the habitat
      corrected.

# ------------------------------------------------------------------- forms
#
# A form field's own validation, by field, then rule. "summary" and "inline"
# as for edit. A rule given as one line shows the same words in both, as does
# one given as "text" beside its "wording". {braces} are filled in by the
# page, from a limit it applies or what was entered. A rule with
# "wording: none" and no words shows common.unworded.

forms:
  projectName:
    # Blank or whitespace only, on the new project and change project name
    # pages alike.
    required: Enter a project name
    tooLong: Project name must be {max} characters or fewer
    # A control character or half of a UTF-16 pair.
    invalidCharacters: Project name must only contain valid characters

  localPlanningAuthorityReference:
    # Not one of the list's options, or one the backend does not know.
    notInList: Select a Local Planning Authority from the list

  surveyCompleters:
    tooLong:
      wording: interim
      text: Survey completer(s) must be {max} characters or fewer

  applicant:
    tooLong:
      wording: interim
      text: Applicant must be {max} characters or fewer

  surveyCompletionDate:
    # Some of the day, month and year are blank, but not all three. {part} is
    # the one that is blank: day, month or year. {parts} are the two that
    # are, as "day and month".
    missingOne: Survey completion date must include a {part}
    missingSeveral: Survey completion date must include {parts}
    notReal: Survey completion date must be a real date

  uploadType:
    # The "What would you like to upload?" page, with no choice made.
    required: Select the type of file you want to upload

  file:
    # The upload page, shown in place of the form when the file uploader
    # gave the page nowhere to send the file.
    cannotStart: Unable to start file upload. Please try again later.
    # Checked in the browser before the file is sent, and again by the
    # service once it has it.
    noFile: Select a GeoPackage (.gpkg) file
    # Not named .gpkg, or not a GeoPackage at all.
    notAGeoPackage: The selected file must be a GeoPackage (.gpkg)
    # {max} is the size limit, as "100 MB".
    tooLarge: The selected file must be smaller than {max}
    invalidName: The file name can only include letters, numbers, spaces, hyphens, underscores, full stops or brackets
    nameTooLong: The file name must be {max} characters or fewer
    # The upload page, once the service has looked at the uploaded file.
    # The checks gave up waiting for a busy validator. There is nothing wrong
    # with the file, so this must not suggest changing it.
    # The same words as the drop-out page's upload.errors.VALIDATION_BUSY
    # heading, which this repeats with *serviceBusy: change them there.
    serviceBusy: *serviceBusy
    timedOut: The file check timed out. Please try again.

  habitatRef:
    # Blank, whitespace only or not UTF-8, on the baseline details page, the
    # retained post-intervention details page and the created habitat page.
    invalid:
      summary: You have entered an invalid habitat reference.
      inline: Enter a valid habitat reference.
    # Longer than {max} characters once trimmed (BMD-1175), which the backend
    # refuses rather than cuts. {max} is MAX_HABITAT_REF_LENGTH
    # (common/helpers/habitat-ref.js).
    tooLong:
      wording: interim
      text: Enter a habitat reference of {max} characters or fewer.

  # The supporting information (the habitat's comment) on the baseline habitat
  # details page, for every feature type it serves alike (BMD-1112). The
  # same two rules the upload applies, whose wording for a whole file is
  # upload.errors.COMMENT_TOO_LONG and COMMENT_INVALID_CHARACTERS. {max} is
  # MAX_COMMENT_LENGTH in habitat-comment.js, which mirrors the backend's.
  # Both rules are shown but have not been through UCD, so each says
  # "wording: interim" rather than marking it in a comment (BMD-1112 AC5
  # words them as placeholders).
  comment:
    # Longer than {max} characters once leading and trailing whitespace has
    # been removed. A comment of exactly {max} is allowed.
    tooLong:
      wording: interim
      summary: The supporting information is too long.
      inline: Supporting information must be {max} characters or less.
    # Holds characters that are not valid UTF-8.
    invalidCharacters:
      wording: interim
      summary: The supporting information uses invalid characters.
      inline: The supporting information can only use UTF-8 characters.

  # The created habitat, hedgerow and watercourse page's choices. A choice that is not one
  # of its options can only be an imported value no longer offered.
  broadHabitat:
    invalid: Choose a valid broad habitat
  habitatType:
    notInBroadHabitat: Choose a habitat type for the selected broad habitat
    invalidHedgerow: Choose a valid hedgerow habitat type
    invalidWatercourse: Choose a valid watercourse habitat type
    invalidTree: Choose Urban tree or Rural tree
  condition:
    notForHabitatType: Choose a target condition for the selected habitat type
  strategicSignificance:
    invalid: Choose a valid strategic significance
  watercourseEncroachment:
    invalid: Choose a valid watercourse encroachment
  riparianEncroachment:
    invalid: Choose a valid riparian encroachment
  advanceOrDelay:
    invalid: Choose a valid advance or delay value
    # Both an advance and a delay of more than zero years.
    both:
      summary: A habitat cannot be created both in advance and with a delay.
      inline: Either the advance or delay field must be set at zero.

# ------------------------------------------------------------------- pages
#
# A whole page shown in place of the one asked for. "title" is its heading
# and the browser tab's title; "body" its paragraphs, one a line, which can
# link with [link text](home) to the service's home page.

pages:
  # The general error page, by what went wrong.
  notFound:
    title: Page not found
  forbidden:
    wording: interim
    title: Forbidden
  unauthorized:
    wording: interim
    title: Unauthorized
  badRequest:
    wording: interim
    title: Bad Request
  conflict:
    # Someone else saved the project first.
    title: Another user is editing this. Please try again.
  serverError:
    # Anything else, including a service the page needed being down.
    title: Something went wrong

  # Signed in, but without the role the service needs.
  accessDenied:
    title: Access denied
    body:
      - You do not have permission to view this page.
      - Access is limited to users with an approved BNG completer role. If your role is still awaiting approval, or you think this is wrong, contact your Defra administrator.
      - '[Return to the home page](home)'

  # A habitat on the post-intervention details page that has no details
  # page of its own, such as an IGGI.
  featureUnsupported:
    body:
      - IGGI features are not yet supported in this view.
